<!doctype html>
<!-- spending-variant.html — WS1.1 live variant. `?depth=flat|raised|floating` selects the ONE axis under
     test; `&dark=1` the scheme; `&still=1` a settled capture. Real interactive HTML (count-up, bars grow,
     hover-lift) themed by the cointrail token sheet — this is what each iframe in the live grid renders. -->
<html lang="en" data-theme="cointrail">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cointrail · spending variant</title>
  <link rel="stylesheet" href="../cointrail.theme.css" />
  <link rel="stylesheet" href="spending-variant.block.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--color-surface-sunken); color: var(--color-on-surface);
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 28px; }
    .stage { max-width: 360px; margin: 0 auto; }
    .vtag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
            color: var(--color-on-surface-subtle); margin: 0 0 10px 2px; }
  </style>
</head>
<body>
  <div class="stage">
    <p class="vtag" id="vtag">variant</p>
    <section class="cb-panel" id="panel" data-role="panel" data-oid="cointrail.category-breakdown" aria-label="Category breakdown">
      <div class="cb-head"><span class="cb-title">Category breakdown</span><span class="cb-sub">This month</span></div>
      <div class="cb-total" data-role="metric">₹0</div>
      <div class="cb-delta">▲ 8.2% vs last month</div>
      <div class="cb-list" id="cb-list" data-role="category-list"></div>
    </section>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const depth = ({ flat: 'flat', raised: 'raised', floating: 'floating' })[q.get('depth')] || 'raised';
    const label = { flat: 'A · flat planes', raised: 'B · raised deck', floating: 'C · floating layers' }[depth];
    const panel = document.getElementById('panel');
    panel.classList.add('depth-' + depth);
    document.getElementById('vtag').textContent = 'cointrail · ' + label;
    if (q.get('dark') === '1') document.documentElement.classList.add('dark');
    const still = q.get('still') === '1';

    const CATS = [
      { name: 'Groceries', amount: 14680, cls: 'cb-c1' }, { name: 'Dining out', amount: 10420, cls: 'cb-c2' },
      { name: 'Transport', amount: 8130, cls: 'cb-c3' }, { name: 'Shopping', amount: 9200, cls: 'cb-c4' },
      { name: 'Bills & utilities', amount: 5820, cls: 'cb-c5' },
    ];
    const total = CATS.reduce((a, c) => a + c.amount, 0);
    const fmt = (n) => '₹' + n.toLocaleString('en-IN');
    const list = document.getElementById('cb-list');
    for (const c of CATS) {
      const pct = Math.round((c.amount / total) * 100);
      const row = document.createElement('div'); row.className = 'cb-row'; row.setAttribute('data-role', 'category-row');
      row.innerHTML = '<span class="cb-swatch ' + c.cls + '"></span><span class="cb-label">' + c.name + '</span>' +
        '<span class="cb-amount">' + fmt(c.amount) + '</span><div class="cb-barwrap"><div class="cb-track">' +
        '<div class="cb-fill ' + c.cls + '" data-role="bar" style="--cb-pct:0%"></div></div><span class="cb-pct">' + pct + '%</span></div>';
      list.appendChild(row);
      const fill = row.querySelector('.cb-fill');
      if (still) { fill.style.transition = 'none'; fill.style.setProperty('--cb-pct', pct + '%'); }
      else requestAnimationFrame(() => fill.style.setProperty('--cb-pct', pct + '%'));
    }
    const totalEl = document.querySelector('.cb-total');
    if (still || matchMedia('(prefers-reduced-motion: reduce)').matches) { totalEl.textContent = fmt(total); }
    else { const t0 = performance.now(), dur = 900; (function tick(t){ const p = Math.min((t - t0) / dur, 1);
      totalEl.textContent = fmt(Math.round(total * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(tick); })(t0); }
  </script>
</body>
</html>
