StylesPath = styles
MinAlertLevel = error
Vocab = Ottomate

# Only the banned-term check (Vale.Avoid reads the active Vocab's reject.txt).
# Spelling/Repetition are OFF — they flag technical prose as noise; we only want
# retired/dropped terms (e.g. "Telegram" after adr-010) to fail the gate.
[*.md]
BasedOnStyles = Vale
Vale.Spelling = NO
Vale.Repetition = NO
Vale.Avoid = YES
