$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ottomate://schemas/risks.schema.yaml"
title: "Doc 7 — Risks (thinned)"
description: |
  Per-project risk instances + simple security notes.

  THINNED 2026-06-10; full compliance apparatus archived in git history.
  Removed: policies (incl. encryption/key-management/retention/rate-limiting/
  abuse-protection), third_party_services, auth_config, secrets inventory,
  compliance refs. Exposure/access-control/auth capture still happens via the
  tracker routes (/policies, /auth-config — server-side zod is authoritative);
  this schema no longer mirrors that apparatus.

  Risks use `resolved` status (resolved_at + resolution_summary), never deletion.
  The tracker /risk-instances route validates risk_type_id / status /
  severity_override / notes (see tracker-api-inventory.md); link routes exist
  for features and pages only.
type: object
required: [version, project_slug]

properties:
  version: { type: string, const: "1" }
  project_slug: { type: string, pattern: "^[a-z][a-z0-9-]+$" }

  # ===== Risk instances (linked to global catalog) =====
  risk_instances:
    type: array
    items:
      type: object
      required: [risk_type_id, status]
      properties:
        risk_type_id:
          type: string
          description: "FK to global risks_catalog (e.g. 'temp-api-key', 'no-auth', 'sql-injection')"
        status:
          enum: [open, accepted, resolved]
          default: open
          description: "open=active risk; accepted=known with sunset; resolved=fixed (hidden by default)"
        sunset_date:
          type: ["string", "null"]
          format: date-time
          description: "Required when status=accepted"
        resolved_at:
          type: ["string", "null"]
          format: date-time
          description: "Set when status=resolved"
        resolution_summary:
          type: ["string", "null"]
          description: "Brief description of how it was resolved (encourages ADR for significant resolutions)"
        hidden_by_default:
          type: boolean
          default: false
          description: "True for resolved risks; heatmap shows resolved on demand"
        severity_override:
          enum: [low, medium, high, critical]
          description: "Optional local override of catalog default"
        notes:
          type: string

        # Affected-artifact links (only kinds with live link routes — 2026-06-10)
        affected_features:
          type: array
          items: { type: string, pattern: "^feat-[a-z][a-z0-9-]+$" }
        affected_pages:
          type: array
          items: { type: string, pattern: "^page-[a-z][a-z0-9-]+$" }

      allOf:
        - description: "Constraint: risk must affect at least one artifact (no floating risks)"
          anyOf:
            - properties: { affected_features: { minItems: 1 } }
              required: [affected_features]
            - properties: { affected_pages: { minItems: 1 } }
              required: [affected_pages]
        - description: "If accepted, sunset_date required"
          if:
            properties: { status: { const: accepted } }
          then:
            required: [sunset_date]
        - description: "If resolved, resolved_at required"
          if:
            properties: { status: { const: resolved } }
          then:
            required: [resolved_at]

  # ===== Security notes (simple structure replacing the policies apparatus) =====
  security_notes:
    type: array
    description: "Free-form security observations — auth, exposure, secrets handling, third-party caveats"
    items:
      type: object
      required: [note]
      properties:
        category:
          enum: [auth, exposure, secrets, third-party, data, other]
        note: { type: string }
        severity: { enum: [low, medium, high, critical] }
        noted_at: { type: string, format: date-time }

  tags:
    type: array
    items: { type: string }

  created_at: { type: string, format: date-time, readOnly: true }
  updated_at: { type: string, format: date-time, readOnly: true }
