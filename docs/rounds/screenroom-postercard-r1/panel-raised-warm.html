<style>
  .sr { background: #101216; color: #f4f5f8; padding: 20px; font-family: system-ui, sans-serif;
        --au: #e9b84c; --dim: #9aa1b2; --dim2: #7c8292; --line: #ffffff1a; --card: #1c212c; }
  .sr-row { display: grid; grid-template-columns: repeat(4, 168px); gap: 18px; align-items: start; }
  .sr-state { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim2);
              margin-bottom: 7px; }

  /* elevation by surface lightness, not by shadow — the dark-mode form (doctrine 65 / A4 3.6) */
  .mc { position: relative; border-radius: 20px; overflow: hidden; background: var(--card);
        border: 1px solid #ffffff14; transition: transform 260ms ease, background-color 260ms ease; }
  .mc.s-hover { transform: translateY(-6px); background: #242a37; }
  .mc.s-focus { outline: 2px solid var(--au); outline-offset: 2px; }
  .mc.unowned { background: #171a22; border-style: dashed; border-color: #ffffff2e; }

  .pz { aspect-ratio: 2/3; position: relative; overflow: hidden; background: #1a1e28; }
  .pf { width: 100%; height: 100%; display: grid; place-items: center; font-size: 30px; font-weight: 700;
        letter-spacing: .04em; color: #ffffff8c; }
  .p1 { background: linear-gradient(155deg, #2b3346, #141922); }
  .p2 { background: linear-gradient(155deg, #3a2b2b, #191316); }
  .p3 { background: linear-gradient(155deg, #23342f, #121a18); }
  .p4 { background: linear-gradient(155deg, #302b3d, #16131c); }

  .pills { position: absolute; top: 8px; left: 8px; display: flex; gap: 4px; }
  .pills span { font-size: 9px; letter-spacing: .05em; padding: 3px 7px; border-radius: 999px;
                color: #0d1015; background: #dfe3ec; font-weight: 600; }
  .own { position: absolute; left: 8px; bottom: 8px; }
  .chip { font-size: 10px; padding: 4px 9px; border-radius: 999px; font-weight: 600; }
  .c-full { color: #191002; background: var(--au); }
  .c-out { color: var(--dim); background: #0b0d11cc; border: 1px dashed #ffffff2e; }

  /* the partial-ownership meter carries the accent here as well as the chip */
  .meter { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #ffffff14; }
  .meter i { display: block; height: 100%; width: 62%; background: var(--au); }

  .info { position: absolute; top: 7px; right: 7px; width: 24px; height: 24px; border-radius: 999px;
          border: 0; background: #0b0d11cc; color: #e8eaf0; font-size: 11px; line-height: 1; cursor: pointer; }
  .info:focus-visible { outline: 2px solid var(--au); outline-offset: 2px; }

  .cap { padding: 10px 11px 12px; }
  .t { display: block; font-size: 13px; line-height: 1.3; color: #f4f5f8;
       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .yr { display: block; margin-top: 3px; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .gb { display: block; margin-top: 2px; font-size: 11px; color: var(--dim2); font-variant-numeric: tabular-nums; }

  /* P3: motion must be switchable off (floor-reduced-motion). */
  @media (prefers-reduced-motion: reduce){
    .mc, .mc *, .acts { transition: none; animation: none; scroll-behavior: auto; }
  }
</style>

<div class="sr">
  <div class="sr-row">
    <div>
      <div class="sr-state">rest · owned</div>
      <article class="mc" data-role="media-card">
        <div class="pz"><div class="pf p1">AR</div>
          <div class="pills"><span>2160p</span><span>DV</span></div>
          <span class="own"><span class="chip c-full">Owned</span></span>
        </div>
        <button class="info" aria-label="Quick look">i</button>
        <div class="cap"><span class="t" data-role="card-title">Arrival</span><span class="yr" data-role="card-meta">2016</span><span class="gb">14.2 GB</span></div>
      </article>
    </div>

    <div>
      <div class="sr-state">hover · owned</div>
      <article class="mc s-hover" data-role="media-card">
        <div class="pz"><div class="pf p2">DU</div>
          <div class="pills"><span>1080p</span><span>HDR</span></div>
          <span class="own"><span class="chip c-full">Owned</span></span>
        </div>
        <button class="info" aria-label="Quick look">i</button>
        <div class="cap"><span class="t" data-role="card-title">Dune: Part Two</span><span class="yr" data-role="card-meta">2024</span><span class="gb">21.8 GB</span></div>
      </article>
    </div>

    <div>
      <div class="sr-state">focus-visible · partial</div>
      <article class="mc s-focus" data-role="media-card">
        <div class="pz"><div class="pf p3">SE</div>
          <div class="pills"><span>2160p</span></div>
          <span class="own"><span class="chip c-full">6 of 9</span></span>
          <div class="meter"><i></i></div>
        </div>
        <button class="info" aria-label="Quick look">i</button>
        <div class="cap"><span class="t" data-role="card-title">Severance</span><span class="yr" data-role="card-meta">2022</span><span class="gb">38.0 GB</span></div>
      </article>
    </div>

    <div>
      <div class="sr-state">not ours yet</div>
      <article class="mc unowned" data-role="media-card">
        <div class="pz"><div class="pf p4">PO</div>
          <div class="pills"><span>—</span></div>
          <span class="own"><span class="chip c-out">Not ours yet</span></span>
        </div>
        <button class="info" aria-label="Quick look">i</button>
        <div class="cap"><span class="t" data-role="card-title">Poor Things</span><span class="yr" data-role="card-meta">2023</span><span class="gb">request</span></div>
      </article>
    </div>
  </div>
</div>
