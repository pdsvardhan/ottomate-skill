<style>
  .sr { background: #101216; color: #f4f5f8; padding: 20px; font-family: system-ui, sans-serif;
        --au: #e9b84c; --dim: #9aa1b2; --dim2: #5f6575; --line: #ffffff1a; --card: #161a22; }
  .sr-row { display: grid; grid-template-columns: repeat(4, 168px); gap: 18px; align-items: start; }
  .sr-state { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim2);
              margin-bottom: 7px; }

  .mc { position: relative; border-radius: 4px; overflow: hidden; background: var(--card);
        border: 1px solid var(--line); transition: border-color 180ms ease; }
  .mc.s-hover { border-color: #e9b84c66; box-shadow: inset 0 0 0 1px #e9b84c26; }
  .mc.s-focus { outline: 2px solid var(--au); outline-offset: 2px; }
  .mc.unowned { border-style: dashed; border-color: #ffffff2e; }

  .pz { aspect-ratio: 2/3; position: relative; overflow: hidden; background: #1a1e28; }
  .pf { width: 100%; height: 100%; display: grid; place-items: center; font-size: 30px; font-weight: 700;
        letter-spacing: .04em; color: #ffffff8c; }
  .p1 { background: linear-gradient(155deg, #2b3346, #141922); }
  .p2 { background: linear-gradient(155deg, #3a2b2b, #191316); }
  .p3 { background: linear-gradient(155deg, #23342f, #121a18); }
  .p4 { background: linear-gradient(155deg, #302b3d, #16131c); }

  .pills { position: absolute; top: 7px; left: 7px; display: flex; gap: 4px; }
  .pills span { font-size: 9px; letter-spacing: .05em; padding: 2px 5px; border-radius: 2px;
                border: 1px solid #ffffff2e; color: #e8eaf0; background: #0b0d11a6; }
  .own { position: absolute; left: 7px; bottom: 7px; }
  .chip { font-size: 10px; padding: 3px 7px; border-radius: 2px; border: 1px solid; }
  .c-full { color: #f4cf7d; border-color: #e9b84c73; background: #e9b84c1a; }
  .c-out { color: var(--dim); border-color: #ffffff2e; background: #0b0d11a6; border-style: dashed; }

  .info { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 2px;
          border: 1px solid #ffffff2e; background: #0b0d11bf; color: #e8eaf0; font-size: 11px;
          line-height: 1; cursor: pointer; }
  .info:focus-visible { outline: 2px solid var(--au); outline-offset: 2px; }

  .cap { padding: 8px 9px 10px; }
  .t { display: block; font-size: 12.5px; line-height: 1.3; color: #f4f5f8;
       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { display: block; margin-top: 3px; font-size: 11px; color: var(--dim);
         font-variant-numeric: tabular-nums; }
</style>

<div class="sr">
  <div class="sr-row">
    <div>
      <div class="sr-state">rest · owned</div>
      <article class="mc" data-role="media-card">
        <div class="pz"><div class="pf p1">AR</div>
          <div class="pills"><span>2160p</span><span>DV</span></div>
          <span class="own"><span class="chip c-full">Owned</span></span>
        </div>
        <button class="info" aria-label="Quick look">i</button>
        <div class="cap"><span class="t" data-role="card-title">Arrival</span><span class="sub" data-role="card-meta">2016 · 14.2 GB</span></div>
      </article>
    </div>

    <div>
      <div class="sr-state">hover · owned</div>
      <article class="mc s-hover" data-role="media-card">
        <div class="pz"><div class="pf p2">DU</div>
          <div class="pills"><span>1080p</span><span>HDR</span></div>
          <span class="own"><span class="chip c-full">Owned</span></span>
        </div>
        <button class="info" aria-label="Quick look">i</button>
        <div class="cap"><span class="t" data-role="card-title">Dune: Part Two</span><span class="sub" data-role="card-meta">2024 · 21.8 GB</span></div>
      </article>
    </div>

    <div>
      <div class="sr-state">focus-visible</div>
      <article class="mc s-focus" data-role="media-card">
        <div class="pz"><div class="pf p3">SE</div>
          <div class="pills"><span>2160p</span></div>
          <span class="own"><span class="chip c-full">Owned</span></span>
        </div>
        <button class="info" aria-label="Quick look">i</button>
        <div class="cap"><span class="t" data-role="card-title">Severance</span><span class="sub" data-role="card-meta">2022 · 38.0 GB</span></div>
      </article>
    </div>

    <div>
      <div class="sr-state">not ours yet</div>
      <article class="mc unowned" data-role="media-card">
        <div class="pz"><div class="pf p4">PO</div>
          <div class="pills"><span>—</span></div>
          <span class="own"><span class="chip c-out">Not ours yet</span></span>
        </div>
        <button class="info" aria-label="Quick look">i</button>
        <div class="cap"><span class="t" data-role="card-title">Poor Things</span><span class="sub" data-role="card-meta">2023 · request</span></div>
      </article>
    </div>
  </div>
</div>
